    <!-- Bar charts -->
    <rect x="180" y="300" width="22" height="40" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="220" y="270" width="22" height="70" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="260" y="290" width="22" height="50" rx="4" fill="#38bdf8" opacity="0.8" />
